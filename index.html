<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Werkstatt">
<meta name="theme-color" content="#FBFAF7">
<title>Werkstatt Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ── Reset & Root ── */
:root{
  /* ── Atelier Token System ── */
  --bg:#FBFAF7;
  --surface:#FFFFFF;
  --surfaceAlt:#F5F3EE;
  --text:#0F0F10;
  --text2:#5C5953;
  --text3:#A09C95;
  --border:#ECEAE4;
  --border2:#E2DFD8;
  --accent:#2D2419;
  --accentSoft:#F2EFEA;
  --green:#2F7A4A;
  --greenSoft:#E8F1EA;
  --amber:#9C7314;
  --amberSoft:#FBF3DD;
  --red:#B84A3B;
  --redSoft:#FBECE8;
  --blue:#2563A6;
  --blueSoft:#E8F0F8;
  /* ── Compat-Aliases (werden schrittweise entfernt) ── */
  --s1:var(--surface);
  --s2:var(--surfaceAlt);
  --s3:var(--surfaceAlt);
  --gold:var(--accent);
  --gold2:var(--accent);
  --gold3:var(--accentSoft);
  --green2:var(--green);
  --blue2:var(--blue);
  --red2:var(--red);
  --amber2:var(--amber);
  /* ── Safe-area & Radii ── */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --radius:10px;--radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{touch-action:manipulation}
html,body{height:100%;overscroll-behavior:none;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em;font-feature-settings:'ss01','cv11'}
#app{display:flex;flex-direction:column;height:100dvh}

/* ── Auth ── */
#auth{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
.auth-logo{width:56px;height:56px;background:var(--gold2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:1.6rem;font-weight:400;color:#0d0d0f;margin-bottom:1rem;letter-spacing:-.5px}
.auth-title{font-family:'Instrument Serif',serif;font-size:1.9rem;font-weight:400;margin-bottom:.2rem;letter-spacing:-.3px}
.auth-sub{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:2.5px;margin-bottom:1.8rem;font-weight:500}
.auth-box{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:1.4rem}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.1rem}
.auth-tab{flex:1;background:none;border:none;color:var(--text3);padding:.6rem;cursor:pointer;font-family:inherit;font-size:.8rem;border-bottom:2px solid transparent;transition:color .15s;font-weight:500}
.auth-tab.on{color:var(--gold2);border-bottom-color:var(--gold2);font-weight:600}
.auth-err{color:var(--red2);font-size:.76rem;margin-top:.5rem;text-align:center;min-height:1.1rem;font-weight:500}
.auth-ok{color:var(--green2);font-size:.76rem;margin-top:.5rem;text-align:center}

/* ── Header ── */
.hdr{flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--border);
  padding:calc(var(--safe-t) + .65rem) 1rem .65rem;
  display:flex;align-items:center;justify-content:space-between}
.hdr-l{display:flex;align-items:center;gap:.6rem}
.logo{width:32px;height:32px;background:var(--gold2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:.95rem;font-weight:400;color:#0d0d0f;flex-shrink:0}
.hdr-title{font-size:.88rem;font-weight:600;letter-spacing:-.2px}
.hdr-sub{font-size:.68rem;color:var(--text3);margin-top:1px;font-weight:400}
.hdr-r{display:flex;align-items:center;gap:.45rem}
.timer-pill{background:var(--red);border:1px solid var(--red2);border-radius:20px;padding:.22rem .6rem;font-size:.7rem;color:#ffaaaa;font-weight:600;cursor:pointer;letter-spacing:.3px;display:none;align-items:center;gap:.3rem}

/* ── Bottom Nav ── */
.nav{flex-shrink:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--safe-b);order:99}
.nav-btn{flex:1;background:none;border:none;color:var(--text3);padding:.45rem .2rem .4rem;cursor:pointer;font-size:10px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:.22rem;font-weight:500;transition:color .15s;min-width:0;white-space:nowrap;letter-spacing:0.01em}
.nav-btn.on{color:var(--accent);font-weight:600}
.nav-icon{font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;width:40px;height:26px;border-radius:7px;transition:background .15s}
.nav-btn.on .nav-icon{background:var(--accentSoft)}
.nav-btn.on .nav-icon-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin:0 auto;display:block}
.nav-more-panel{position:fixed;inset:0;z-index:200;display:none}
.nav-more-panel.open{display:block}
.nav-more-bg{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.nav-more-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--s1);border-radius:16px 16px 0 0;border:1px solid var(--border2);padding:1rem;padding-bottom:calc(var(--safe-b) + 1rem);display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.nav-more-item{background:var(--s2);border:1px solid var(--border2);border-radius:var(--radius);padding:.8rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;font-size:.82rem;font-weight:500}
.nav-more-item.on{border-color:var(--gold);color:var(--gold2)}

/* ── Content ── */
.content{flex:1;overflow-y:auto;padding:.85rem;padding-bottom:calc(var(--safe-b) + 4.5rem);-webkit-overflow-scrolling:touch}
.inner{max-width:720px;margin:0 auto}

/* ── Buttons ── */
.btn{background:var(--accent);border:none;color:#fff;height:36px;padding:0 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;letter-spacing:-0.01em;transition:opacity .12s;-webkit-user-select:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{opacity:.8}
.btn-g{background:var(--surface);border:1px solid var(--border2);color:var(--text2);height:36px;padding:0 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:border-color .12s}
.btn-g:hover{border-color:var(--border)}
.btn-d{background:var(--surface);border:1px solid var(--border2);color:var(--red);height:36px;padding:0 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500}
.btn-s{background:var(--s2);border:1px solid var(--border2);color:var(--text2);padding:.3rem .65rem;border-radius:7px;cursor:pointer;font-size:.72rem;font-family:inherit;font-weight:500}
.btn-s:active{background:var(--s3)}
.btn-stop{background:#5c1a1a;border:1px solid var(--red2);color:var(--red2);padding:.3rem .7rem;border-radius:7px;cursor:pointer;font-size:.72rem;font-family:inherit;font-weight:600}
.btn-grn{background:var(--green);border:1px solid var(--green2);color:var(--green2);padding:.45rem .8rem;border-radius:var(--radius);cursor:pointer;font-size:.78rem;font-family:inherit;font-weight:500}

/* ── Cards ── */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:.45rem;cursor:pointer;transition:background .1s;position:relative;overflow:hidden}
.card:active{background:var(--s2)}
.card-title{font-weight:600;font-size:.88rem;letter-spacing:-.1px;line-height:1.35}
.card-sub{font-size:.74rem;color:var(--text2);margin-top:.2rem;line-height:1.45;font-weight:400}
.card-accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}

/* ── Badge ── */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:5px;font-size:.68rem;font-weight:600;letter-spacing:.2px}
.b-gold{background:#3d2e0a;color:var(--gold2)}
.b-grn{background:#0d2e1a;color:var(--green2)}
.b-amb{background:#2e1e00;color:var(--amber2)}
.b-red{background:#2e0a0a;color:var(--red2)}
.b-blu{background:#0a1e2e;color:var(--blue2)}
.b-gray{background:var(--s3);color:var(--text2)}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-bottom:.9rem}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem .95rem}
.kpi-val{font-family:'Instrument Serif',serif;font-size:1.7rem;font-weight:400;letter-spacing:-.5px;line-height:1.1}
.kpi-lbl{font-size:.65rem;color:var(--text3);margin-top:.3rem;font-weight:500;letter-spacing:.1px}
.kpi-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:.35rem;vertical-align:middle}

/* ── Chart ── */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:4px;height:80px;margin:.5rem 0}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px}
.chart-bar{width:100%;background:linear-gradient(to top,var(--gold),var(--gold2));border-radius:3px 3px 0 0;min-height:2px}
.chart-lbl{font-size:.55rem;color:var(--text3)}
.chart-val{font-size:.58rem;color:var(--gold2);font-weight:600}

/* ── Timer ── */
.timer-box{background:var(--s2);border:1px solid var(--border2);border-radius:10px;padding:.8rem 1rem;margin-bottom:.8rem;display:flex;align-items:center;justify-content:space-between}
.timer-disp{font-family:'Instrument Serif',serif;font-size:1.8rem;font-weight:600;letter-spacing:2px;color:var(--gold2)}
.timer-sub{font-size:.62rem;color:var(--text3);margin-top:.15rem}

/* ── Teile ── */
.teil-item{background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:.75rem .85rem;margin-bottom:.4rem}
.as-item{background:var(--s3);border:1px solid var(--border2);border-radius:6px;padding:.5rem .75rem;margin-bottom:.3rem;display:flex;align-items:center;gap:.5rem}
.as-name{flex:1;font-size:.78rem;min-width:0}
.as-time{font-family:'Instrument Serif',serif;font-size:.88rem;color:var(--gold2);font-weight:600;white-space:nowrap}

/* ── Positionen ── */
.pos-row{display:grid;grid-template-columns:1fr 60px 70px 70px 24px;gap:.4rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.78rem}
.pos-head{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px}

/* ── Foto ── */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.4rem}
.photo-thumb{aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--s2);border:1px solid var(--border2);position:relative}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.75);border:none;color:#fff;width:20px;height:20px;border-radius:50%;font-size:.65rem;cursor:pointer}
.photo-add{aspect-ratio:1;border-radius:6px;border:1px dashed var(--border2);background:none;color:var(--text3);font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── Form (Atelier) ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500;letter-spacing:0.01em}
input,select,textarea{width:100%;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;outline:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
input::placeholder{color:var(--text3)}
select option{background:var(--surface)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ── Modal (Atelier) ── */
.overlay{position:fixed;inset:0;background:rgba(15,15,16,.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:680px;max-height:90dvh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(15,15,16,.18)}
.modal-hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 24px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);gap:12px}
.modal-hdr h3{font-family:'Instrument Serif',serif;font-size:22px;font-weight:400;letter-spacing:-0.02em;line-height:1.2}
.modal-close{background:var(--surfaceAlt);border:1px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-body{padding:22px 24px;overflow-y:auto;flex:1}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;margin-top:0}
@media(max-width:639px){
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:95dvh;padding-bottom:var(--safe-b)}
}

/* ── Misc ── */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.sec-head h2{font-size:1.15rem;font-weight:700;letter-spacing:-.3px}
.sec-h3{font-size:.92rem;font-weight:600;margin-bottom:.6rem;letter-spacing:-.1px}
.sec-label{font-size:.67rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:.45rem;margin-top:.85rem;font-weight:600}
.divider{border:none;border-top:1px solid var(--border);margin:.75rem 0}
.tbl-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.8rem;gap:.4rem}
.alert{background:var(--amber)22;border:1px solid var(--amber2)44;border-radius:var(--radius);padding:.7rem .85rem;margin-bottom:.85rem}
.alert-t{color:var(--amber2);font-size:.67rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:.28rem;font-weight:600}
.empty{color:var(--text3);font-size:.8rem;padding:.5rem 0;font-weight:400}
.loading{text-align:center;color:var(--text3);padding:2rem;font-size:.85rem}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Atelier Top-Bar ── */
.atl-top{height:56px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:20px}
.atl-logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;letter-spacing:-0.01em;flex-shrink:0;white-space:nowrap}
.atl-logo-mark{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:16px;line-height:1;flex-shrink:0}
.atl-logo-name{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.atl-search{flex:1;max-width:480px;height:34px;background:var(--surfaceAlt);border:1px solid var(--border);border-radius:8px;align-items:center;padding:0 12px;gap:10px;color:var(--text3);font-size:13px;display:none}
.atl-search-kbd{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.atl-top-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.atl-iconbtn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text2);background:none;border:none;cursor:pointer}
.atl-iconbtn:hover{background:var(--surfaceAlt)}
.atl-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;overflow:hidden;white-space:nowrap}
.atl-divider-v{width:1px;height:20px;background:var(--border);flex-shrink:0}
.atl-timer-pill{background:var(--accent);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer;display:none;align-items:center;gap:6px;border:none;white-space:nowrap;font-family:inherit}

/* ── Atelier Body + Side Nav ── */
.atl-body{flex:1;display:flex;min-height:0;overflow:hidden}
.atl-side-nav{width:220px;border-right:1px solid var(--border);background:var(--surface);padding:16px 12px;display:none;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto}
.atl-nav-sect{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:14px 10px 6px;font-weight:500}
.atl-nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--text2);font-weight:500;cursor:pointer;user-select:none;-webkit-user-select:none}
.atl-nav-item.on{background:var(--surfaceAlt);color:var(--text)}
.atl-nav-item:hover:not(.on){background:var(--surfaceAlt)}
.atl-nav-ico{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.atl-nav-count{margin-left:auto;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.atl-nav-item.on .atl-nav-count{color:var(--text)}
.atl-nav-spacer{flex:1;min-height:8px}
.atl-main{flex:1;overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch;padding:.85rem;padding-bottom:calc(var(--safe-b) + 4.5rem)}

/* ── Responsive Breakpoints ── */
@media(min-width:1024px){
  .hdr{display:none}
  .nav{display:none!important}
  .nav-more-panel{display:none!important}
  .atl-side-nav{display:flex}
  .atl-search{display:flex}
  .atl-main{padding:24px 32px;padding-bottom:24px}
  .inner{max-width:none;margin:0}
}
@media(max-width:1023px){
  .atl-top{height:52px;padding:calc(var(--safe-t) + 0px) 16px 0}
  .atl-logo-name{display:none}
}

/* ── Atelier Page Structure ── */
.atl-content{padding:28px 32px}

/* ── Page Header ── */
.atl-pageheader{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.atl-greet{font-family:'Instrument Serif',serif;font-size:32px;font-weight:400;letter-spacing:-0.02em;line-height:1.1}
.atl-greet-sub{color:var(--text2);font-size:13px;margin-top:6px}
.atl-pageheader-actions{display:flex;gap:8px;flex-shrink:0}

/* ── Atelier Buttons ── */
.atl-btn{height:32px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;letter-spacing:-0.005em;font-family:inherit}
.atl-btn:hover{background:var(--surfaceAlt)}
.atl-btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.atl-btn-primary:hover{opacity:.92}
.atl-btn-sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}

/* ── KPI Strip ── */
.atl-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px}
.atl-kpi{background:var(--surface);padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.atl-kpi-lbl{font-size:12px;color:var(--text2);font-weight:500}
.atl-kpi-val{font-family:'Instrument Serif',serif;font-size:36px;line-height:1;letter-spacing:-0.025em}
.atl-kpi-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.atl-trend{display:inline-flex;align-items:center;gap:3px;font-weight:500;font-variant-numeric:tabular-nums}
.atl-trend.up{color:var(--green)}.atl-trend.down{color:var(--red)}.atl-trend.flat{color:var(--text2)}

/* ── Atelier Cards ── */
.atl-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:0}
.atl-card-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.atl-card-title{font-size:14px;font-weight:600;letter-spacing:-0.01em}
.atl-card-sub{font-size:12px;color:var(--text2);margin-top:2px}
.atl-card-body{padding:16px 20px}
.atl-card-link{font-size:12px;color:var(--text2);font-weight:500;display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:none;border:none;font-family:inherit;white-space:nowrap}
.atl-card-link:hover{color:var(--text)}

/* ── Grid Layouts ── */
.atl-grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.atl-grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ── Cashflow Chart ── */
.atl-chart{height:180px;display:flex;align-items:flex-end;gap:6px;padding:8px 0 0}
.atl-bar-col{flex:1;display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.atl-bar-wrap{flex:1;display:flex;align-items:flex-end;gap:2px}
.atl-bar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.atl-bar.expense{background:var(--surfaceAlt);border:1px solid var(--border2)}
.atl-bar-lbl{font-size:10px;color:var(--text3);text-align:center;font-variant-numeric:tabular-nums}
.atl-chart-legend{display:flex;gap:16px;font-size:11px;color:var(--text2);margin-top:12px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
.atl-legend-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ── Schedule Rows ── */
.atl-sched-row{display:flex;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border)}
.atl-sched-row:last-child{border-bottom:none}
.atl-sched-time{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums;min-width:52px;padding-top:2px;flex-shrink:0}
.atl-sched-bar{width:2px;background:var(--accent);border-radius:1px;flex-shrink:0;align-self:stretch;min-height:32px}
.atl-sched-bar.gray{background:var(--border2)}

/* ── List Rows ── */
.atl-list{display:flex;flex-direction:column}
.atl-row{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);gap:14px;cursor:pointer}
.atl-row:last-child{border-bottom:none}
.atl-row:hover{background:var(--bg)}
.atl-row-thumb{width:36px;height:36px;border-radius:8px;background:var(--surfaceAlt);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--text2);flex-shrink:0;font-family:'Instrument Serif',serif;letter-spacing:-0.01em}
.atl-row-title{font-size:13px;font-weight:500;letter-spacing:-0.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atl-row-sub{font-size:12px;color:var(--text2);margin-top:1px}
.atl-row-meta{margin-left:auto;text-align:right;font-size:12px;color:var(--text2);flex-shrink:0}
.atl-row-amt{font-family:'Instrument Serif',serif;font-size:18px;color:var(--text);letter-spacing:-0.01em;display:block}

/* ── Atelier Badges ── */
.atl-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:500;letter-spacing:0.005em;white-space:nowrap;flex-shrink:0}
.atl-badge .atl-bdot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.atl-b-green{background:var(--greenSoft);color:var(--green)}
.atl-b-amber{background:var(--amberSoft);color:var(--amber)}
.atl-b-red{background:var(--redSoft);color:var(--red)}
.atl-b-blue{background:var(--blueSoft);color:var(--blue)}
.atl-b-gray{background:var(--surfaceAlt);color:var(--text2)}
.atl-b-dark{background:var(--accent);color:#fff}

/* ── Atelier Alerts ── */
.atl-alert{background:var(--amberSoft);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;font-size:13px}
.atl-alert.red{background:var(--redSoft)}

/* ── Dashboard Responsive ── */
@media(max-width:1023px){
  .atl-content{padding:16px}
  .atl-kpi-row{grid-template-columns:1fr 1fr}
  .atl-grid-2,.atl-grid-2b{grid-template-columns:1fr;gap:12px}
  .atl-greet{font-size:22px}
  .atl-pageheader{margin-bottom:16px}
}

/* ── Filter Bar & Chips ── */
.atl-filters{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.atl-chip{height:28px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--text2);border:1px solid var(--border);display:inline-flex;align-items:center;gap:5px;background:var(--surface);font-weight:500;cursor:pointer;user-select:none;-webkit-user-select:none}
.atl-chip:hover{background:var(--surfaceAlt)}
.atl-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.atl-chip-count{background:var(--surfaceAlt);color:var(--text2);padding:0 5px;border-radius:3px;font-size:11px;font-variant-numeric:tabular-nums}
.atl-chip.on .atl-chip-count{background:rgba(255,255,255,.2);color:#fff}

/* ── Atelier Table ── */
.atl-tbl{width:100%;border-collapse:collapse;font-size:13px}
.atl-tbl thead th{text-align:left;font-size:11px;font-weight:500;color:var(--text2);padding:10px 14px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em;background:var(--bg);white-space:nowrap}
.atl-tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.atl-tbl tbody tr:last-child td{border-bottom:none}
.atl-tbl tbody tr{cursor:pointer}
.atl-tbl tbody tr:hover td{background:var(--bg)}
.atl-tbl-num{text-align:right!important}
.atl-tbl-amt{font-family:'Instrument Serif',serif;font-size:15px}
.atl-tabnum{font-variant-numeric:tabular-nums}
.atl-tbl-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--text2)}

/* ── Meta Definition Grid ── */
.atl-meta-grid{display:grid;grid-template-columns:auto 1fr;row-gap:6px;column-gap:14px;font-size:12px}
.atl-meta-grid dt{color:var(--text2);font-weight:500;white-space:nowrap}
.atl-meta-grid dd{color:var(--text);font-variant-numeric:tabular-nums;margin:0}

/* ── Detail Page Layout ── */
.atl-breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-bottom:16px}
.atl-breadcrumb span:last-child{font-family:'JetBrains Mono',monospace;color:var(--text)}
.atl-detail-grid{display:grid;grid-template-columns:1fr 296px;gap:16px;align-items:start}
.atl-section-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500;margin-bottom:10px}
.atl-vcol{display:flex;flex-direction:column;gap:16px}

/* ── Progress Steps ── */
.atl-steps{display:flex;gap:4px;margin:4px 0 2px}
.atl-step{flex:1}
.atl-step-bar{height:4px;border-radius:2px;background:var(--surfaceAlt)}
.atl-step-bar.done{background:var(--accent)}
.atl-step-bar.active{background:var(--amber)}
.atl-step-lbl{font-size:10px;color:var(--text3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atl-step-lbl.done,.atl-step-lbl.active{color:var(--text)}

/* ── Activity / Kommentare ── */
.atl-activity{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border)}
.atl-activity:last-child{border-bottom:none}
.atl-activity-av{width:26px;height:26px;border-radius:50%;background:var(--surfaceAlt);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.atl-activity-quote{font-size:12px;color:var(--text2);margin-top:4px;padding:8px 12px;background:var(--bg);border-radius:6px;font-style:italic;border:1px solid var(--border)}

/* ── Timer Card ── */
.atl-timer-card{background:var(--accent);color:#fff;border-radius:10px;padding:20px;display:flex;align-items:center;justify-content:space-between}
.atl-timer-disp{font-family:'Instrument Serif',serif;font-size:40px;letter-spacing:.04em;line-height:1}
.atl-timer-sub{font-size:12px;opacity:.7;margin-top:4px}
.atl-timer-card .atl-btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff}
.atl-timer-card .atl-btn:hover{background:rgba(255,255,255,.25)}
.atl-timer-card-neutral{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.atl-timer-disp-sm{font-family:'Instrument Serif',serif;font-size:28px;letter-spacing:.02em;line-height:1;color:var(--text)}

@media(max-width:1023px){
  .atl-detail-grid{grid-template-columns:1fr}
}

/* ── Kunden / Lager Side-Rail ── */
.atl-side-rail{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.atl-rail-col{display:flex;flex-direction:column;gap:14px}
.atl-kunden-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:18px;font-weight:400;flex-shrink:0}
.atl-kpi-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px}

/* ── Bestandsbalken ── */
.atl-stock-bar{height:4px;border-radius:2px;background:var(--surfaceAlt);overflow:hidden;max-width:80px;flex-shrink:0}
.atl-stock-fill{height:100%;border-radius:2px}

/* ── Wochenübersicht Zeiterfassung ── */
.atl-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:24px}
.atl-week-day{display:flex;flex-direction:column;align-items:center;gap:4px}
.atl-week-bar-wrap{height:100px;display:flex;align-items:flex-end}
.atl-week-bar{width:28px;border-radius:3px 3px 0 0;background:var(--accent);min-height:2px;transition:height .2s}
.atl-week-bar.planned{background:var(--surfaceAlt);border:1px solid var(--border2)}
.atl-week-bar.today{background:var(--accent)}
.atl-week-lbl{font-size:11px;color:var(--text3)}
.atl-week-val{font-size:11px;font-variant-numeric:tabular-nums;color:var(--text2)}
.atl-week-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* Verbrauchsbalken */
.atl-usage-bar{height:3px;border-radius:1.5px;background:var(--surfaceAlt);overflow:hidden;margin-top:4px}
.atl-usage-fill{height:100%;background:var(--accent)}

@media(max-width:1023px){
  .atl-side-rail{grid-template-columns:1fr}
  .atl-kpi-row-3{grid-template-columns:1fr 1fr 1fr}
}

/* ── Dokumente (Angebote / Rechnungen) ── */
.atl-doc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.atl-doc-h{padding:48px 48px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:32px;border-bottom:1px solid var(--border)}
.atl-doc-body{padding:32px 48px 48px}
@media(max-width:1023px){.atl-doc-h{padding:24px 24px 16px}.atl-doc-body{padding:20px 24px 28px}}

/* ── Werkstattplan ── */
.plan-toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.plan-wk{display:flex;align-items:center;gap:5px}
.plan-wk-nav{width:28px;height:28px;border-radius:6px;background:var(--surfaceAlt);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;font-size:16px;line-height:1}
.plan-wk-lbl{font-family:'Instrument Serif',serif;font-size:18px;letter-spacing:-0.015em;padding:0 8px;white-space:nowrap}
.plan-grid{display:grid;grid-template-columns:190px repeat(5,1fr);border-top:1px solid var(--border)}
.plan-corner{padding:10px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);font-weight:500}
.plan-day-head{padding:10px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.plan-day-head.today{background:var(--accentSoft);color:var(--accent)}
.plan-day-head:last-child{border-right:none}
.plan-emp{padding:12px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface)}
.plan-emp-thumb{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.plan-emp-name{font-size:13px;font-weight:600}
.plan-emp-meta{font-size:11px;color:var(--text2);margin-top:2px}
.plan-day{position:relative;min-height:100px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;padding:6px 4px;display:flex;flex-direction:column;gap:4px}
.plan-day:last-child{border-right:none}
.plan-day.today{background:var(--accentSoft)}
.plan-job{border-radius:5px;font-size:11px;color:#fff;padding:5px 8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.3;flex-shrink:0}
.plan-job.urgent{outline:1.5px solid var(--red);outline-offset:1px}
.plan-job.active{position:relative}
.plan-job.active::after{content:'';position:absolute;right:5px;top:50%;transform:translateY(-50%);width:5px;height:5px;background:#fff;border-radius:50%;animation:pulse-plan 1.6s infinite}
@keyframes pulse-plan{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:1023px){.plan-grid{grid-template-columns:100px repeat(5,1fr)}.plan-emp{padding:8px 10px}.plan-emp-name{font-size:11px}}

/* ── Empty / Edge States ── */
.empty-stage{padding:64px 40px;text-align:center;max-width:500px;margin:40px auto 0}
.empty-glyph{width:72px;height:72px;border-radius:18px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.empty-h1{font-family:'Instrument Serif',serif;font-size:32px;letter-spacing:-0.025em;line-height:1.15;margin-bottom:10px}
.empty-h1 em{font-style:italic;color:var(--accent)}
.empty-sub{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:20px;max-width:380px;margin-left:auto;margin-right:auto}
.empty-actions{display:flex;gap:8px;justify-content:center}

/* ── Step 10: Animations & Keyframes ── */
@keyframes atl-fade-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes atl-modal-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes atl-slide-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes atl-pulse-soft{0%,100%{opacity:1}50%{opacity:.55}}

/* Content entrance */
.atl-content{animation:atl-fade-in .18s cubic-bezier(.2,.9,.3,1) both}

/* Modal entrance */
.modal{animation:atl-modal-in .22s cubic-bezier(.2,.9,.3,1) both}
@media(max-width:639px){.modal{animation:atl-slide-up .22s cubic-bezier(.2,.9,.3,1) both}}

/* Loading pulse */
.loading{animation:atl-pulse-soft 1.4s ease-in-out infinite}

/* ── Step 10: Transitions ── */
/* Buttons */
.atl-btn{transition:background .1s,opacity .1s,box-shadow .1s}
.atl-btn:active{transform:scale(.98)}
.atl-btn-primary:active{opacity:.85}
/* Old buttons */
.btn-g:active{background:var(--surfaceAlt)}
/* Chips */
.atl-chip{transition:background .1s,color .1s,border-color .1s}
.atl-chip:active{transform:scale(.97)}
/* Table rows */
.atl-tbl tbody td{transition:background .1s}
.atl-tbl tbody tr{transition:background .1s}
/* List rows */
.atl-row{transition:background .1s}
/* Nav items */
.atl-nav-item{transition:background .12s,color .12s}
.atl-iconbtn{transition:background .12s}
/* Bottom nav icon pill */
.nav-btn:active .nav-icon{transform:scale(.9);transition:transform .08s}
/* Plan jobs */
.plan-job{transition:filter .12s,outline-color .12s}
.plan-job:hover{filter:brightness(1.12)}
/* KPI cards */
.atl-kpi{transition:background .1s}
/* Cards (desktop hover lift) */
@media(min-width:1024px){
  .atl-card{transition:box-shadow .15s,border-color .15s}
  .atl-card:hover{border-color:var(--border2)}
}
/* Focus rings for keyboard nav */
.atl-btn:focus-visible,.atl-chip:focus-visible,.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Smooth filter bar chip row on mobile */
.atl-filters{scroll-behavior:smooth}
/* Week bar entrance */
.atl-week-bar{animation:atl-slide-up .25s cubic-bezier(.2,.9,.3,1) both}
/* Badges: no animation, but consistent transitions */
.atl-badge{transition:opacity .1s}
/* Overlay fade */
.overlay{animation:atl-fade-in .15s ease both}
/* atl-list rows stagger (first 6) */
.atl-list>.atl-row:nth-child(1){animation-delay:.03s}
.atl-list>.atl-row:nth-child(2){animation-delay:.06s}
.atl-list>.atl-row:nth-child(3){animation-delay:.09s}
.atl-list>.atl-row:nth-child(4){animation-delay:.12s}
.atl-list>.atl-row:nth-child(5){animation-delay:.15s}
.atl-list>.atl-row:nth-child(6){animation-delay:.18s}
.atl-list>.atl-row{animation:atl-fade-in .2s cubic-bezier(.2,.9,.3,1) both}

/* ── Step 9: Tablet (640–1023px) ── */
@media(min-width:640px) and (max-width:1023px){
  .atl-content{padding:20px 24px}
  .atl-btn{height:40px;padding:0 16px;font-size:14px}
  .atl-btn-sm{height:32px;padding:0 12px}
  .atl-tbl tbody td{padding:14px 16px}
  .atl-tbl thead th{padding:11px 16px}
  .atl-chip{height:34px;padding:0 13px;font-size:13px}
  .atl-timer-disp{font-size:48px}
  .atl-kpi-val{font-size:28px}
  .atl-kpi{padding:16px 20px}
}

/* ── Step 9: Phone (<640px) ── */
@media(max-width:639px){
  /* Page structure */
  .atl-content{padding:12px 14px}
  .atl-pageheader{flex-direction:column;align-items:flex-start;gap:10px}
  .atl-pageheader-actions{width:100%;overflow-x:auto;scrollbar-width:none}
  .atl-pageheader-actions::-webkit-scrollbar{display:none}
  .atl-greet{font-size:20px}
  .atl-greet-sub{font-size:12px}
  /* KPI strip */
  .atl-kpi-row{grid-template-columns:1fr 1fr}
  .atl-kpi-val{font-size:22px}
  .atl-kpi{padding:12px 14px;gap:6px}
  .atl-kpi-lbl,.atl-kpi-meta{font-size:11px}
  .atl-kpi-row-3{grid-template-columns:1fr 1fr 1fr}
  /* Filter bar — horizontal scroll */
  .atl-filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:10px 14px;gap:6px}
  .atl-filters::-webkit-scrollbar{display:none}
  /* Timer card — stack */
  .atl-timer-card{flex-direction:column;align-items:flex-start;gap:12px}
  .atl-timer-card>.atl-btn{align-self:stretch;justify-content:center}
  .atl-timer-disp{font-size:28px}
  /* Week chart */
  .atl-week-bar-wrap{height:60px}
  .atl-week-bar{width:18px}
  .atl-week-val{display:none}
  /* Plan grid — compact */
  .plan-toolbar{padding:10px 14px;gap:8px}
  .plan-grid{grid-template-columns:64px repeat(5,1fr)}
  .plan-emp{padding:6px 8px;gap:6px}
  .plan-emp-meta{display:none}
  .plan-emp-thumb{width:24px;height:24px;font-size:10px}
  .plan-job{font-size:10px;padding:4px 6px}
  /* Detail */
  .atl-breadcrumb{display:none}
  .atl-vcol,.atl-detail-grid{gap:10px}
  /* Empty states */
  .empty-stage{padding:32px 20px}
  .empty-h1{font-size:22px}
  .empty-glyph{width:56px;height:56px;border-radius:14px}
  /* Doc layout */
  .atl-doc-h{padding:18px 18px 14px;flex-direction:column;gap:14px}
  .atl-doc-body{padding:16px 18px 24px}
  /* Modal */
  .modal-hdr h3{font-size:18px}
  .modal-hdr{padding:14px 18px}
  .modal-body{padding:16px 18px}
  .modal-foot{padding:12px 18px}
  /* Form grids collapse */
  .g2,.g3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-logo">W</div>
  <div class="auth-title">Werkstatt Pro</div>
  <div class="auth-sub">Dein Betriebssystem</div>

const DB = {
  _get(table){try{return JSON.parse(localStorage.getItem('wp_'+table)||'[]')}catch(e){return[]}},
  _set(table,data){try{localStorage.setItem('wp_'+table,JSON.stringify(data))}catch(e){}},
  select(table){return{data:this._get(table),error:null}},
  insert(table,rows){
    const data=this._get(table);
    rows.forEach(r=>{if(!r.id)r.id=crypto.randomUUID();if(!r.erstellt_am)r.erstellt_am=new Date().toISOString();data.push(r)});
    this._set(table,data);return{data:rows,error:null};
  },
  update(table,id,updates){
    const data=this._get(table).map(r=>r.id===id?{...r,...updates}:r);
    this._set(table,data);return{data:null,error:null};
  },
  delete(table,id){
    this._set(table,this._get(table).filter(r=>r.id!==id));
    return{data:null,error:null};
  },
  upsert(table,row){
    const data=this._get(table);
    const idx=data.findIndex(r=>r.id===row.id||r.profil_id===row.profil_id);
    if(idx>=0)data[idx]={...data[idx],...row};else data.push(row);
    this._set(table,data);return{data:row,error:null};
  }
};

// Smart query wrapper - uses DB (local) or SB (cloud)
function sbq(table){
  if(isLocalMode){
    return {
      select(cols){
        return {
          eq(col,val){
            const data=DB._get(table).filter(r=>r[col]===val);
            return {
              single(){return Promise.resolve({data:data[0]||null,error:null})},
              order(){return Promise.resolve({data,error:null})},
              then(fn){return Promise.resolve({data,error:null}).then(fn)},
              gte(c2,v2){const d2=data.filter(r=>r[c2]>=v2);return{order(){return Promise.resolve({data:d2,error:null})},then(fn){return Promise.resolve({data:d2,error:null}).then(fn)}}},
            };
          },
          order(col,opts){
            let data=DB._get(table);
            data=data.sort((a,b)=>opts?.ascending!==false?String(a[col]||'').localeCompare(String(b[col]||'')):String(b[col]||'').localeCompare(String(a[col]||'')));
            return Promise.resolve({data,error:null});
          },
          gte(col,val){
            const data=DB._get(table).filter(r=>r[col]>=val);
            return{order(){return Promise.resolve({data,error:null})}};
          },
          single(){return Promise.resolve({data:DB._get(table)[0]||null,error:null})},
          then(fn){return Promise.resolve({data:DB._get(table),error:null}).then(fn)},
        };
      },
      insert(rows){
        const result=DB.insert(table,Array.isArray(rows)?rows:[rows]);
        return{select(){return{single(){return Promise.resolve({data:result.data[0],error:null})}}},then(fn){return Promise.resolve(result).then(fn)}};
      },
      update(updates){
        return{
          eq(col,val){
            const data=DB._get(table).map(r=>r[col]===val?{...r,...updates}:r);
            DB._set(table,data);
            return Promise.resolve({data:null,error:null});
          }
        };
      },
      delete(){
        return{
          eq(col,val){DB._set(table,DB._get(table).filter(r=>r[col]!==val));return Promise.resolve({data:null,error:null})},
          in(col,vals){DB._set(table,DB._get(table).filter(r=>!vals.includes(r[col])));return Promise.resolve({data:null,error:null})},
        };
      },
      upsert(row){
        DB.upsert(table,Array.isArray(row)?row[0]:row);
        return Promise.resolve({data:null,error:null});
      },
    };
  }
  return sbq(table);
}

  async getSession(){
    if(!isLocalMode)return SB.auth.getSession();
    const s=this._session();return{data:{session:s}};

  async signInWithPassword({email,password}){
    const users=this._users();
    const u=users.find(x=>x.email===email&&x.password===password);
    if(!u)return{data:null,error:{message:'Invalid login credentials'}};
    const session={user:{id:u.id,email:u.email}};
    localStorage.setItem('wp_auth_session',JSON.stringify(session));
    return{data:{user:session.user},error:null};
  },
  async signUp({email,password,options}){
    const users=this._users();
    if(users.find(x=>x.email===email))return{data:null,error:{message:'User already registered'}};
    const id=crypto.randomUUID();
    users.push({id,email,password,name:options?.data?.name||email});

    return{data:{user:{id,email}},error:null};

  async signOut(){
    localStorage.removeItem('wp_auth_session');
    S.user=null;S.profil=null;showAuth();
  },
  onAuthStateChange(){return{data:{subscription:{unsubscribe:()=>{}}}};}
};

// ── Boot ─────────────────────────────────────────────────────────
// Session laden
async function boot(u){
  if(S.user?.id===u?.id&&S.profil?.id)return;
  S.user=u;
  try{
    const[{data:p},{data:f}]=await Promise.all([
      sbq('profile').select('*').eq('id',u.id).single(),
      isLocalMode?Promise.resolve({data:DB._get('firma')[0]||{}}):sbq('firma').select('*').eq('id',1).single()
    ]);
    S.profil=p||{};S.firma=f||{};
    // Freigabe-Check + kein Admin vorhanden → ersten User auto-promoten
    {
      const needsApproval=p&&p.freigegeben===false;
      const notAdmin=p&&p.rolle!=='admin';
      if(needsApproval||notAdmin){
        const{data:admins}=await sbq('profile').select('id').eq('rolle','admin').eq('freigegeben',true);
        if(!admins||admins.length===0){
          await sbq('profile').update({freigegeben:true,rolle:'admin'}).eq('id',u.id);
          if(p){p.freigegeben=true;p.rolle='admin';}
          S.profil=p;
        } else if(needsApproval){
          showAuth();
          document.getElementById('a-err').textContent='Dein Account wartet auf Freigabe durch den Admin.';
          if(!isLocalMode)await SB.auth.signOut();
          return;
        }
      }
    }
    document.getElementById('hdr-user').textContent=(p?.name||u.email).split(' ')[0];
    document.getElementById('hdr-sub').textContent=S.firma.firmenname||'Werkstatt Pro';
  }catch(e){
    S.profil={};S.firma={};
    document.getElementById('hdr-user').textContent=u.email.split('@')[0];
  }
  hideAuth();
  try{await load();}catch(e){console.warn('load error',e)}
  try{
    const{data:t}=await sbq('aktive_timer').select('*').eq('profil_id',u.id).single();
    if(t){S.timer={...t,startEpoch:Number(t.start_epoch)};S.aktId=t.auftrag_id;startTick()}
  }catch(_){}
  render();
}

// ── Timer ─────────────────────────────────────────────────────────
function elapsed(){return S.timer?Date.now()-S.timer.startEpoch:0}
function fmt(ms){if(!ms||ms<0)return'00:00:00';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return`${pad(h)}:${pad(m%60)}:${pad(s%60)}`}
function fmtShort(ms){if(!ms||ms<0)return'0:00';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h?`${h}:${pad(m%60)}`:`${m}:${pad(s%60)}`}
function pad(n){return String(n).padStart(2,'0')}

async function startTimer(typ,aid,tid,sid){
  await stopTimer();
  S.timer={typ,auftragId:aid,teilId:tid||null,schrittId:sid||null,startEpoch:Date.now()};
  await sbq('aktive_timer').upsert({profil_id:S.user.id,auftrag_id:aid,teil_id:tid||null,schritt_id:sid||null,typ,start_epoch:S.timer.startEpoch});
  startTick();
}
async function stopTimer(){
  if(!S.timer)return;
  const d=elapsed();
  await sbq('zeiteintraege').insert([{auftrag_id:S.timer.auftragId,teil_id:S.timer.teilId,schritt_id:S.timer.schrittId,profil_id:S.user.id,typ:S.timer.typ,start_zeit:new Date(S.timer.startEpoch).toISOString(),end_zeit:new Date().toISOString(),dauer_ms:d}]);
  await sbq('aktive_timer').delete().eq('profil_id',S.user.id);
  S.timer=null;stopTick();
}
function startTick(){
  stopTick();
  const pill=document.getElementById('t-pill'),val=document.getElementById('t-val');
  if(pill)pill.style.display='flex';
  S.tick=setInterval(()=>{
    const e=elapsed();
    if(val)val.textContent=fmtShort(e);
    document.querySelectorAll('[data-live]').forEach(el=>el.textContent=fmt(e));
  },1000);
}
function stopTick(){
  if(S.tick){clearInterval(S.tick);S.tick=null}
  const pill=document.getElementById('t-pill');
  if(pill)pill.style.display='none';
}
window.goTimer=async()=>{if(!S.timer)return;S.aktId=S.timer.auftragId;if(!aBy(S.aktId))await load();S.tab='detail';render()};

  const openAn=S.angebote.filter(a=>a.status==='entwurf'||a.status==='versendet').length;

// ── AUFTRÄGE ──────────────────────────────────────────────────────
function vAuftraege(){
  const srch=(document.getElementById('auftrag-search')?.value||'').toLowerCase();
  const statusFilter=S.filter==='ueberfaellig'?null:S.filter;
  const list=S.auftraege.filter(a=>{
    const matchStatus=S.filter==='alle'?true:S.filter==='ueberfaellig'?(a.faellig_am&&new Date(a.faellig_am)<new Date()&&a.status!=='abgeschlossen'):(a.status===statusFilter);
    const matchSrch=!srch||a.titel?.toLowerCase().includes(srch)||(kBy(a.kunde_id)?.name||'').toLowerCase().includes(srch);
    return matchStatus&&matchSrch;
  });
  const counts={alle:S.auftraege.length,offen:S.auftraege.filter(a=>a.status==='offen').length,in_arbeit:S.auftraege.filter(a=>a.status==='in_arbeit').length,abgeschlossen:S.auftraege.filter(a=>a.status==='abgeschlossen').length,ueberfaellig:S.auftraege.filter(a=>a.faellig_am&&new Date(a.faellig_am)<new Date()&&a.status!=='abgeschlossen').length};
  const chip=(id,lbl)=>`<span class="atl-chip${S.filter===id?' on':''}" onclick="S.filter='${id}';render()">${lbl}<span class="atl-chip-count">${counts[id]}</span></span>`;
  const auNr=(a,i)=>{const y=new Date(a.erstellt_am||Date.now()).getFullYear();return`AU-${y}-${String(S.auftraege.length-i).padStart(4,'0')}`};
  const prio=(p)=>p==='dringend'?atlBadge('red','Dringend',true):p==='hoch'?atlBadge('amber','Hoch',true):'';

  return`
<div class="atl-content">
  <div class="atl-pageheader">
    <div>
      <div class="atl-greet">Aufträge</div>
      <div class="atl-greet-sub">${S.auftraege.length} gesamt · ${counts.offen} offen · ${counts.in_arbeit} in Arbeit${counts.ueberfaellig?' · '+counts.ueberfaellig+' überfällig':''}</div>
    </div>
    <div class="atl-pageheader-actions">
      <button class="atl-btn atl-btn-primary" onclick="openM('neuA')">
        <svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Neuer Auftrag
      </button>
    </div>
  </div>
  <section class="atl-card">
    <div class="atl-filters">
      ${chip('alle','Alle')}${chip('offen','Offen')}${chip('in_arbeit','In Arbeit')}${chip('abgeschlossen','Abgeschlossen')}${counts.ueberfaellig?chip('ueberfaellig','Überfällig'):''}
      <div style="margin-left:auto;height:28px;background:var(--surfaceAlt);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;padding:0 10px;gap:8px;min-width:180px">
        <svg style="width:13px;height:13px;stroke:var(--text3);fill:none;stroke-width:1.5;stroke-linecap:round;flex-shrink:0" viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M11 19a8 8 0 110-16 8 8 0 010 16z"/></svg>
        <input id="auftrag-search" placeholder="Auftrag, Kunde…" oninput="render()" style="background:none;border:none;outline:none;font-size:12px;color:var(--text);width:100%;font-family:inherit">
      </div>
    </div>
    <div style="overflow-x:auto">
      <table class="atl-tbl">
        <thead><tr>
          <th style="width:110px">Nummer</th>
          <th>Auftrag</th>
          <th style="width:130px">Typ</th>
          <th style="width:110px">Fällig</th>
          <th style="width:110px">Status</th>
          <th style="width:90px">Priorität</th>
        </tr></thead>
        <tbody>
          ${list.map((a,i)=>`
          <tr onclick="openA('${a.id}')">
            <td class="atl-tabnum" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2)">${auNr(a,S.auftraege.indexOf(a))}</td>
            <td>
              <div class="atl-row-title">${a.titel}${S.timer?.auftragId===a.id?' <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:4px;vertical-align:middle"></span>':''}</div>
              <div class="atl-row-sub">${kBy(a.kunde_id)?.name||'—'} · ${fmtDate(a.erstellt_am)}</div>
            </td>
            <td style="color:var(--text2);font-size:12px">${tBy(a.auftragstyp_id)?.name||'—'}</td>
            <td class="atl-tabnum" style="font-size:12px;color:${a.faellig_am&&new Date(a.faellig_am)<new Date()&&a.status!=='abgeschlossen'?'var(--red)':'var(--text)'}">${fmtDate(a.faellig_am)}</td>
            <td>${sBadgeAtl(a.status)}</td>
            <td>${prio(a.prioritaet)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${list.length===0?'<div style="padding:40px 20px;text-align:center;color:var(--text3);font-size:13px">Keine Aufträge gefunden.</div>':''}
    <div class="atl-tbl-footer">
      <span>${list.length} von ${S.auftraege.length} Aufträgen</span>
    </div>
  </section>
</div>`;
}

// ── AUFTRAG DETAIL ─────────────────────────────────────────────────
async function vDetail(){
  const a=aBy(S.aktId);if(!a){document.getElementById('content').innerHTML='<div class="empty">Nicht gefunden</div>';return}
  const k=kBy(a.kunde_id);
  const detailAside=()=>`
    <div class="atl-vcol">
      <section class="atl-card">
        <div class="atl-card-body">
          <div class="atl-section-label">Kunde</div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <div class="atl-row-thumb" style="width:40px;height:40px;font-size:15px">${k?(k.name.split(' ').slice(0,2).map(w=>w[0]).join('')):'?'}</div>
            <div>
              <div style="font-weight:600;font-size:14px">${k?.name||'—'}</div>

            ${a.faellig_am?`<dt>Fällig</dt><dd style="color:${new Date(a.faellig_am)<new Date()&&a.status!=='abgeschlossen'?'var(--red)':'var(--amber)'};font-weight:500">${fmtDate(a.faellig_am)}</dd>`:''}
            <dt>Stundensatz</dt><dd>€ ${(a.stundensatz||45).toFixed(2).replace('.',',')}</dd>
            ${a.notizen?`<dt>Notizen</dt><dd style="color:var(--text2)">${a.notizen}</dd>`:''}
          </dl>
        </div>
      </section>
      <section class="atl-card">
        <div class="atl-card-body" style="display:flex;flex-direction:column;gap:8px">
          <div class="atl-section-label">Aktionen</div>
          <button class="atl-btn" onclick="openM('editA','${a.id}')" style="justify-content:center">Bearbeiten</button>
          <button class="atl-btn" onclick="openAngMitZeit('${a.id}')" style="justify-content:center">Angebot erstellen</button>
          <button class="atl-btn" onclick="openReMitZeit('${a.id}')" style="justify-content:center">Rechnung erstellen</button>
          <button class="atl-btn" onclick="dPDF('${a.id}')" style="justify-content:center">PDF exportieren</button>
          <button class="atl-btn" style="border-color:var(--redSoft);color:var(--red);justify-content:center;margin-top:4px" onclick="dDelA('${a.id}')">Auftrag löschen</button>
        </div>
      </section>
    </div>`;

  if(isDemoMode){
    const low=S.inventar.filter(i=>i.mindestbestand>0&&i.bestand<=i.mindestbestand);
    document.getElementById('content').innerHTML=`
<div class="atl-content">
  <div class="atl-breadcrumb"><span onclick="setTab('auftraege')" style="cursor:pointer">Aufträge</span><span>›</span><span>${a.titel}</span></div>
  <div class="atl-pageheader">
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">${sBadgeAtl(a.status)}${a.prioritaet&&a.prioritaet!=='normal'?sBadgeAtl(a.prioritaet):''}</div>
      <div class="atl-greet">${a.titel}</div>
      <div class="atl-greet-sub">${k?.name||'—'} · ${fmtDate(a.erstellt_am)}${a.faellig_am?' · fällig '+fmtDate(a.faellig_am):''}</div>

  </div>
  <div class="atl-detail-grid">
    <div class="atl-vcol">
      <section class="atl-card">
        <div class="atl-card-h"><div class="atl-card-title">Timer (Demo)</div></div>
        <div class="atl-card-body">
          <div class="atl-timer-card-neutral">
            <div>
              <div class="atl-section-label">Allgemeine Zeit</div>
              <div class="atl-timer-disp-sm">01:23:45</div>
              <div style="font-size:12px;color:var(--text2);margin-top:2px">Demo-Modus · kein echter Timer</div>

        <div class="atl-card-h"><div class="atl-card-title">Material</div></div>

          <div style="margin-top:8px;padding:14px;background:var(--surfaceAlt);border-radius:8px;text-align:center;font-size:12px;color:var(--text3)">Demo-Modus · Bearbeiten nicht verfügbar</div>
        </div>
      </section>
    </div>
    ${detailAside()}
  </div>
</div>`;
    return;
  }
  let tr,zr,mr,fr;
  if(isLocalMode){
    const teile=DB._get('auftrag_teile').filter(t=>t.auftrag_id===a.id);
    const schritte=DB._get('arbeitsschritte');
    teile.forEach(t=>t.arbeitsschritte=schritte.filter(s=>s.teil_id===t.id));
    const profData=DB._get('profile');
    const zeitenRaw=DB._get('zeiteintraege').filter(e=>e.auftrag_id===a.id);
    zeitenRaw.forEach(e=>{e.profile=profData.find(p=>p.id===e.profil_id)||null});
    tr={data:teile};
    zr={data:zeitenRaw.sort((a,b)=>b.start_zeit?.localeCompare(a.start_zeit||'')||0)};
    mr={data:DB._get('auftrag_material').filter(m=>m.auftrag_id===a.id)};
    fr={data:DB._get('fotos').filter(f=>f.auftrag_id===a.id)};
  } else {
    [tr,zr,mr,fr]=await Promise.all([
      sbq('auftrag_teile').select('*,arbeitsschritte(*)').eq('auftrag_id',a.id).order('reihenfolge'),
      sbq('zeiteintraege').select('*,profile(name)').eq('auftrag_id',a.id).order('start_zeit',{ascending:false}),
      sbq('auftrag_material').select('*').eq('auftrag_id',a.id),

  const lohn=a.stundensatz?(gZ/3600000)*a.stundensatz:0;
  const isFen=tBy(a.auftragstyp_id)?.name==='Fensterrestaurierung';
  const gL=S.timer?.typ==='global'&&S.timer?.auftragId===a.id;

<div class="atl-content">

      </div>
      <div class="atl-greet">${a.titel}</div>
      <div class="atl-greet-sub">${k?.name||'—'} · ${fmtDate(a.erstellt_am)}${a.faellig_am?' · fällig '+fmtDate(a.faellig_am):''}</div>
    </div>
    <div class="atl-pageheader-actions">
      ${gL?`<button class="atl-btn atl-btn-primary" onclick="dStop()" style="background:var(--red);border-color:var(--red)">Timer stoppen</button>`:`<button class="atl-btn" onclick="dStart('global','${a.id}')"${S.timer?' disabled style="opacity:.45"':''}>
        <svg style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round" viewBox="0 0 24 24"><path d="M12 6v6l4 2M12 22a10 10 0 110-20 10 10 0 010 20z"/></svg>
        Timer starten</button>`}
      <button class="atl-btn atl-btn-primary" onclick="openM('editA','${a.id}')">Bearbeiten</button>
    </div>
  </div>

  <div class="atl-detail-grid">

        </div>
      </section>

      ${Z.filter(e=>e.typ==='global').length?`
      <section class="atl-card">

          ${Z.filter(e=>e.typ==='global').slice(0,5).map(e=>`
          <div class="atl-row" style="cursor:default">
            <div style="flex:1"><div class="atl-row-title">${e.profile?.name||'—'}</div><div class="atl-row-sub">${fmtDate(e.start_zeit)}</div></div>
            <span class="atl-tabnum" style="font-family:'Instrument Serif',serif;font-size:16px">${fmt(e.dauer_ms)}</span>
            <button onclick="dDelZ('${e.id}')" style="background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;font-size:14px">✕</button>
          </div>`).join('')}
        </div>
      </section>`:''}

      <section class="atl-card">
        <div class="atl-card-h">
          <div class="atl-card-title">${isFen?'Fensterflügel & Stock':'Teile & Schritte'}</div>

        <div class="atl-card-body">
          <textarea rows="4" placeholder="Notizen zum Auftrag…" onblur="dSaveNotiz('${a.id}',this.value)" style="width:100%;background:var(--surfaceAlt);border:1px solid var(--border2);border-radius:7px;padding:10px 12px;font-family:inherit;font-size:13px;color:var(--text);resize:vertical;outline:none">${a.notizen||''}</textarea>
        </div>
      </section>

      <!-- Kommentare -->
      <section class="atl-card">
        <div class="atl-card-h"><div class="atl-card-title">Aktivität</div></div>

// ── WERKSTATTPLAN ─────────────────────────────────────────────────
window._planWkOff=0;
window._planNav=function(d){window._planWkOff+=d;document.getElementById('content').innerHTML=vPlan()};
function vPlan(){
  const off=window._planWkOff||0;
  const today=new Date();
  const dow=(today.getDay()+6)%7;
  const wStart=new Date(today);
  wStart.setDate(today.getDate()-dow+off*7);
  wStart.setHours(0,0,0,0);
  // KW
  const kw=(()=>{const d=new Date(Date.UTC(wStart.getFullYear(),wStart.getMonth(),wStart.getDate()));const dn=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-dn);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7)})();
  // 5 weekdays
  const days=Array.from({length:5},(_,i)=>{const d=new Date(wStart);d.setDate(wStart.getDate()+i);return d});
  const wEnd=new Date(days[4]);wEnd.setDate(days[4].getDate()+1);
  // Employees
  const emps=(S.nutzer&&S.nutzer.filter(n=>n.freigegeben).length>0)?S.nutzer.filter(n=>n.freigegeben):[S.profil].filter(Boolean);
  const empColors=['#2D2419','#2563A6','#1F8A5B','#9C7314','#B84A3B'];
  // Aktive + backlog Auftraege
  const aktiv=S.auftraege.filter(a=>a.status==='in_arbeit');
  const backlog=S.auftraege.filter(a=>a.status==='offen');
  // Auftrag → color by type
  function aufColor(a){const t=tBy(a.auftragstyp_id);return t?.farbe||empColors[S.auftraege.indexOf(a)%empColors.length]||'#2D2419'}
  // Build week label
  const opt={day:'numeric',month:'long'};
  const wkLbl=`KW ${kw} · ${days[0].toLocaleDateString('de-AT',{day:'numeric',month:'short'})} – ${days[4].toLocaleDateString('de-AT',{day:'numeric',month:'short',year:'numeric'})}`;
  // Day headers
  const dNames=['Mo','Di','Mi','Do','Fr'];
  const dayHeads=days.map((d,i)=>{
    const isT=d.toDateString()===today.toDateString();
    return`<div class="plan-day-head${isT?' today':''}">${dNames[i]} ${d.getDate()}</div>`;
  }).join('');
  // Employee rows
  const empRows=emps.map((emp,ei)=>{
    const ini=(n)=>{if(!n)return'?';const w=n.trim().split(/\s+/);return(w.length>=2?w[0][0]+w[1][0]:n.slice(0,2)).toUpperCase()};
    const clr=emp.avatar_farbe||empColors[ei%empColors.length];
    // This employee's jobs: round-robin from aktiv
    const myJobs=aktiv.filter((_,idx)=>emps.length===1||idx%emps.length===ei);
    const empCols=days.map((d,di)=>{
      const isT=d.toDateString()===today.toDateString();
      const blocks=myJobs.map(a=>{
        const isAct=S.timer?.auftragId===a.id&&isT;
        const isUrg=a.prioritaet==='dringend';
        const c=aufColor(a);
        return`<div class="plan-job${isAct?' active':''}${isUrg?' urgent':''}" style="background:${c}" title="${a.titel}">${a.titel}</div>`;
      }).join('');
      return`<div class="plan-day${isT?' today':''}">${blocks}</div>`;
    }).join('');
    return`<div class="plan-emp">
      <div class="plan-emp-thumb" style="background:${clr}">${ini(emp.name)}</div>
      <div><div class="plan-emp-name">${emp.name||'Mitarbeiter'}</div>
        <div class="plan-emp-meta">${emp.rolle||'Mitarbeiter'} · ${myJobs.length} Auftrag${myJobs.length!==1?'e':''}</div></div>
    </div>${empCols}`;
  }).join('');
  // Legend
  const legendItems=aktiv.map(a=>{
    const c=aufColor(a);
    return`<span><span style="display:inline-block;width:10px;height:10px;background:${c};margin-right:5px;vertical-align:middle;border-radius:2px"></span>${a.titel}</span>`;
  }).join('');
  // Backlog rows
  const backlogRows=backlog.map((a,i)=>{
    const k=kBy(a.kunde_id);
    const tone=a.prioritaet==='dringend'?'red':a.prioritaet==='hoch'?'amber':'gray';
    const auNr=`AU-${new Date().getFullYear()}-${String(i+1).padStart(4,'0')}`;
    return`<div class="atl-row">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2)">${auNr}</span>
          ${atlBadge(tone,'nicht verplant')}
        </div>
        <div class="atl-row-title" style="margin-top:2px">${a.titel}</div>
        <div class="atl-row-sub">${k?.name||'—'}${a.faellig_am?' · Fällig '+fmtDate(a.faellig_am):''}${a.prioritaet==='dringend'?' · Dringend':''}</div>
      </div>
      <button class="atl-btn atl-btn-sm" onclick="openA('${a.id}')">Öffnen</button>
    </div>`;
  }).join('');
  return`
<div class="atl-content" style="max-width:100%">
  <div class="atl-pageheader">
    <div><div class="atl-greet">Werkstattplan</div>
      <div class="atl-greet-sub">${emps.length} Mitarbeiter · ${aktiv.length} aktive Aufträge${backlog.length?' · '+backlog.length+' im Backlog':''}</div></div>
    <div class="atl-pageheader-actions">
      <button class="atl-btn atl-btn-primary" onclick="openM('neuA')"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg> Neuer Auftrag</button>
    </div>
  </div>
  <section class="atl-card">
    <div class="plan-toolbar">
      <div class="plan-wk">
        <button class="plan-wk-nav" onclick="window._planNav(-1)">‹</button>
        <div class="plan-wk-lbl">${wkLbl}</div>
        <button class="plan-wk-nav" onclick="window._planNav(1)">›</button>
      </div>
      ${off!==0?`<button class="atl-btn atl-btn-sm" onclick="window._planWkOff=0;document.getElementById('content').innerHTML=vPlan()">Heute</button>`:''}
      <div style="flex:1"></div>
      <div class="atl-tabs">
        <span class="atl-tab on">Woche</span>
        <span class="atl-tab">Auftrag</span>
      </div>
    </div>
    ${aktiv.length===0&&emps.length>0?`
    <div style="padding:40px 24px;text-align:center;color:var(--text3);font-size:13px">
      Keine aktiven Aufträge diese Woche. <button class="atl-btn atl-btn-sm" style="margin-left:8px" onclick="openM('neuA')">Neuer Auftrag</button>
    </div>`:`
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <div class="plan-grid" style="min-width:460px">
      <div class="plan-corner">Mitarbeiter</div>${dayHeads}
      ${empRows}
    </div></div>
    ${legendItems?`<div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:16px;align-items:center;font-size:11px;color:var(--text2);flex-wrap:wrap">${legendItems}<span style="margin-left:auto;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;background:var(--red);border-radius:50%;display:inline-block;margin-right:4px"></span>Dringend</span></div>`:''}`}
  </section>
  ${backlog.length?`
  <section class="atl-card" style="margin-top:16px">
    <div class="atl-card-h">
      <div><div class="atl-card-title">Nicht verplant · Backlog</div>
        <div class="atl-card-sub">${backlog.length} Auftrag${backlog.length!==1?'e':''} warten auf Termin</div></div>
      <button class="atl-btn atl-btn-sm" onclick="S.tab='auftraege';render()">Alle Aufträge</button>
    </div>
    <div class="atl-list">${backlogRows}</div>
  </section>`:''}
</div>`;
}

function angBadge(s){
  const m={entwurf:['gray','Entwurf'],versendet:['blue','Versendet'],angenommen:['green','Angenommen'],abgelehnt:['red','Abgelehnt'],abgelaufen:['red','Abgelaufen']};
  const[tone,lbl]=m[s]||['gray',s||'—'];
  return atlBadge(tone,lbl,s==='versendet'||s==='angenommen');
}
function reBadge(s){
  const m={entwurf:['gray','Entwurf'],gesendet:['blue','Gesendet'],bezahlt:['green','Bezahlt'],ueberfaellig:['red','Überfällig'],storniert:['gray','Storniert']};
  const[tone,lbl]=m[s]||['gray',s||'—'];
  const now=new Date();
  return atlBadge(tone,lbl,s==='gesendet'||s==='bezahlt');
}

// ── ZEITERFASSUNG ─────────────────────────────────────────────────
async function vZeiterfassung(){
  let zeiten;
  const since=new Date(Date.now()-30*24*3600000).toISOString();
  if(isLocalMode){
    const raw=DB._get('zeiteintraege').filter(e=>e.start_zeit>since);
    const pData=DB._get('profile');
    raw.forEach(e=>{e.profile=pData.find(p=>p.id===e.profil_id)||null});
    zeiten=raw;
  } else {
    const{data:_z}=await sbq('zeiteintraege').select('*,profile(name)').gte('start_zeit',since).order('start_zeit',{ascending:false});
    zeiten=_z;
  }
  const Z=zeiten||[];
  const now=new Date();
  const dow=(now.getDay()+6)%7;
  const wStart=new Date(now);wStart.setDate(now.getDate()-dow);wStart.setHours(0,0,0,0);
  const wEnd=new Date(wStart);wEnd.setDate(wStart.getDate()+7);
  // KW number
  const kw=(()=>{const d=new Date(Date.UTC(wStart.getFullYear(),wStart.getMonth(),wStart.getDate()));const dn=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-dn);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7)})();
  const wZ=Z.filter(e=>new Date(e.start_zeit)>=wStart&&new Date(e.start_zeit)<wEnd);
  const wMs=wZ.reduce((s,e)=>s+(e.dauer_ms||0),0);
  const wH=wMs/3600000;
  const soll=40;
  const diff=wH-soll;
  const hz=S.profil?.stundensatz||45;
  const verrMs=wZ.filter(e=>e.auftrag_id).reduce((s,e)=>s+(e.dauer_ms||0),0);
  const verrH=verrMs/3600000;
  const gesH=Z.reduce((s,e)=>s+(e.dauer_ms||0),0)/3600000;
  // Per-auftrag this week
  const aufMs={};
  wZ.forEach(e=>{if(e.auftrag_id)aufMs[e.auftrag_id]=(aufMs[e.auftrag_id]||0)+(e.dauer_ms||0)});
  const maxMs=Math.max(...Object.values(aufMs),1);
  // Day bars
  const dNames=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const dayBars=dNames.map((d,i)=>{
    const ds=new Date(wStart);ds.setDate(wStart.getDate()+i);
    const de=new Date(ds);de.setDate(ds.getDate()+1);
    const dMs=Z.filter(e=>new Date(e.start_zeit)>=ds&&new Date(e.start_zeit)<de).reduce((s,e)=>s+(e.dauer_ms||0),0);
    const dH=dMs/3600000;
    return{d,dt:ds.getDate(),h:dH,pct:Math.min(Math.round((dH/10)*100),100),isToday:ds.toDateString()===now.toDateString()};
  });
  document.getElementById('content').innerHTML=`
<div class="atl-content">
  <div class="atl-pageheader">
    <div><div class="atl-greet">Zeiterfassung</div>
      <div class="atl-greet-sub">KW ${kw} · ${wH.toFixed(1).replace('.',',')} h erfasst von ${soll} h Soll</div></div>
    <div class="atl-pageheader-actions">
      <button class="atl-btn atl-btn-primary" onclick="S.tab='auftraege';render()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><polyline points="8 5 8 8 10 10"/></svg>
        Timer starten
      </button>
    </div>
  </div>

// ── STATISTIK ─────────────────────────────────────────────────────
async function vStats(){
  let zeiten;
  if(isLocalMode){
    zeiten=DB._get('zeiteintraege').filter(e=>e.start_zeit>new Date(Date.now()-365*24*3600000).toISOString());
  } else {
    const{data:_z}=await sbq('zeiteintraege').select('*').gte('start_zeit',new Date(Date.now()-365*24*3600000).toISOString());
    zeiten=_z;
  }
  const Z=zeiten||[];
  // Monatliche Einnahmen
  const monMap={};
  S.rechnungen.filter(r=>r.status==='bezahlt').forEach(r=>{
    const m=new Date(r.erstellt_am).toLocaleString('de-AT',{month:'short',year:'2-digit'});
    monMap[m]=(monMap[m]||0)+(r.brutto||0);
  });
  const monate=Object.entries(monMap).slice(-6);
  const maxVal=Math.max(...monate.map(([,v])=>v),1);
  // Stunden nach Auftragstyp
  const typStd={};
  S.auftraege.forEach(a=>{
    const std=Z.filter(e=>e.auftrag_id===a.id).reduce((s,e)=>s+(e.dauer_ms||0),0)/3600000;
    const typ=tBy(a.auftragstyp_id)?.name||'Sonstiges';
    typStd[typ]=(typStd[typ]||0)+std;
  });
  const gesStd=Z.reduce((s,e)=>s+(e.dauer_ms||0),0)/3600000;
  const abg=S.auftraege.filter(a=>a.status==='abgeschlossen').length;
  const offen=S.auftraege.filter(a=>a.status==='offen'||a.status==='in_arbeit').length;
  document.getElementById('content').innerHTML=`
<div class="sec-head"><h2>Statistik</h2></div>
<div class="kpi-grid">
  <div class="kpi" style="border-left-color:var(--blue2)"><div class="kpi-val">${gesStd.toFixed(1)}</div><div class="kpi-lbl">Std (letztes Jahr)</div></div>
  <div class="kpi" style="border-left-color:var(--green2)"><div class="kpi-val">${abg}</div><div class="kpi-lbl">Abgeschlossen</div></div>
  <div class="kpi" style="border-left-color:var(--amber2)"><div class="kpi-val">${offen}</div><div class="kpi-lbl">Offen</div></div>
  <div class="kpi" style="border-left-color:var(--gold2)"><div class="kpi-val">${S.kunden.length}</div><div class="kpi-lbl">Kunden</div></div>
</div>
${monate.length?`
  <div style="background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.8rem">
    <div style="font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:.7rem">Einnahmen (bezahlt)</div>
    <div class="chart-bar-wrap">
      ${monate.map(([m,v])=>`
        <div class="chart-bar-col">
          <div class="chart-val">€${v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)}</div>
          <div class="chart-bar" style="height:${Math.max(4,Math.round((v/maxVal)*70))}px"></div>
          <div class="chart-lbl">${m}</div>
        </div>`).join('')}
    </div>
  </div>`:'<div class="card"><div class="empty">Noch keine bezahlten Rechnungen</div></div>'}
${Object.keys(typStd).length?`
  <div style="background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:1rem">
    <div style="font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:.7rem">Stunden nach Auftragstyp</div>
    ${Object.entries(typStd).sort((a,b)=>b[1]-a[1]).map(([typ,std])=>{
      const t=S.typen.find(x=>x.name===typ);
      const pct=Math.round((std/Math.max(gesStd,1))*100);
      return`<div style="margin-bottom:.6rem">
        <div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:.25rem">
          <span style="color:${t?.farbe||'var(--text2)'}">${typ}</span>
          <span style="color:var(--text2)">${std.toFixed(1)} Std</span>
        </div>
        <div style="height:6px;background:var(--s2);border-radius:3px">
          <div style="height:100%;width:${pct}%;background:${t?.farbe||'var(--gold)'};border-radius:3px"></div>
        </div>
      </div>`;}).join('')}
  </div>`:''}`;
}

              <div class="card-sub">${n.letzter_login?'Zuletzt: '+new Date(n.letzter_login).toLocaleString('de-AT'):'Noch nicht eingeloggt'}</div>
              <div class="card-sub">${auftraegeN} Aufträge zugewiesen</div>

          </div>
        </div>

    }).join('')}
    ${nutzer.filter(n=>n.freigegeben).length===0?'<div class="empty">Keine freigegebenen Nutzer</div>':''}
  `;
}

window.freigebenNutzer=async(id)=>{
  await sbq('profile').update({freigegeben:true}).eq('id',id);
  await load();vNutzer();
};
window.ablehnNutzer=async(id)=>{
  if(!confirm('Nutzer ablehnen und löschen?'))return;
  await sbq('profile').delete().eq('id',id);
  // Auth user löschen geht nur über Admin API - zeige Hinweis
  await load();vNutzer();
  alert('Profil gelöscht. Lösche den Auth-User auch in Supabase → Authentication → Users.');
};

// ── MODALS ────────────────────────────────────────────────────────
function oClose(e){if(e.target.classList.contains('overlay'))closeM()}
function closeM(){S.modal=null;document.getElementById('modal-root').innerHTML=''}
function mWrap(title,body){return`<div class="modal"><div class="modal-hdr"><h3>${title}</h3><button class="modal-close" onclick="closeM()">✕</button></div><div class="modal-body">${body}</div></div>`}

function mHTML(){
  const{t,d}=S.modal;
  if(t==='neuA')return mNeuA();
  if(t==='editA')return mEditA(aBy(d));
  if(t==='neuK')return mK(null);
  if(t==='editK')return mK(S.kunden.find(k=>k.id===d));
  if(t==='neuInv')return mInv(null);
  if(t==='editInv')return mInv(S.inventar.find(i=>i.id===d));
  if(t==='neuTeil')return mTeil(...(d||'|').split('|'),null);
  if(t==='editTeil'){mTeilLoad(d);return mWrap('Laden…','<div class="loading">…</div>')}
  if(t==='_tLoaded')return mTeilF(d.aid,d.typ,d.teil);
  if(t==='zMan')return mZMan(d);
  if(t==='mat')return mMat(d);
  if(t==='zeitVorschlag')return mHTML_zeitVorschlag(d);
  if(t==='neuAng')return mAng(null,d);
  if(t==='editAng')return mAng(S.angebote.find(a=>a.id===d),null);
  if(t==='neuRe')return mRe(null,d);
  if(t==='editRe')return mRe(S.rechnungen.find(r=>r.id===d),null);
  if(t==='neuTyp')return mTyp(null);
  if(t==='editTyp')return mTyp(S.typen.find(x=>x.id===d));
  if(t==='editProfil')return mProfil();
  if(t==='editFirma')return mFirma();
  if(t==='fotoUp')return mFotoUp(d);
  if(t==='editNutzer')return mEditNutzer(S.nutzer?.find(n=>n.id===d));
  return'';
}

  const typen=S.typen.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  const ku=S.kunden.map(k=>`<option value="${k.id}">${k.name}</option>`).join('');
  return mWrap('Neuer Auftrag',`
    <div class="field"><label>Titel *</label><input id="m-t" placeholder="z.B. Hauptstraße 5 – Fenster EG"></div>
    <div class="g2">
      <div class="field"><label>Auftragstyp</label><select id="m-typ"><option value="">—</option>${typen}</select></div>

    </div>

      <div class="field"><label>Status</label><select id="m-s"><option value="offen">Offen</option><option value="in_arbeit">In Arbeit</option></select></div>
      <div class="field"><label>Priorität</label><select id="m-prio">

        <option value="normal" selected>Normal</option>
        <option value="hoch">Hoch</option>
        <option value="dringend">Dringend</option>
      </select></div>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Werkstatt Pro">
  <meta name="theme-color" content="#0a0a0c">
  <title>Werkstatt Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-logo">W</div>
  <div class="auth-title">Werkstatt Pro</div>
  <div class="auth-sub">Dein Betriebssystem</div>
  <div class="auth-box">
    <div class="auth-tabs">
      <button class="auth-tab on" onclick="authTab('login')">Anmelden</button>
      <button class="auth-tab" onclick="authTab('reg')">Registrieren</button>
    </div>

    <div id="auth-login">
      <div class="field">
        <label>E-Mail</label>
        <input id="a-mail" type="email" autocomplete="email" placeholder="name@beispiel.at"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input id="a-pw" type="password" autocomplete="current-password" placeholder="••••••••"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button id="login-btn" class="btn" style="width:100%;min-height:48px;font-size:.9rem"
              ontouchend="event.preventDefault();doLogin()" onclick="doLogin()">
        Anmelden
      </button>
      <div id="a-err" class="auth-err"></div>
      <div class="auth-divider"></div>
      <button class="btn-secondary" style="width:100%;min-height:44px"
              ontouchend="event.preventDefault();startDemo()" onclick="startDemo()">
        Demo-Modus — ohne Anmeldung
      </button>
    </div>

    <div id="auth-reg" style="display:none">
      <div class="field">
        <label>Name</label>
        <input id="r-name" placeholder="Dein Name" autocomplete="name">
      </div>
      <div class="field">
        <label>E-Mail</label>
        <input id="r-mail" type="email" placeholder="name@beispiel.at" autocomplete="email">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input id="r-pw" type="password" placeholder="Min. 6 Zeichen" autocomplete="new-password">
      </div>
      <button class="btn" style="width:100%;min-height:48px;font-size:.9rem" onclick="doReg()">
        Registrieren
      </button>
      <div id="r-ok" class="auth-ok"></div>
      <div id="r-err" class="auth-err"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header class="hdr">
    <div class="hdr-l">
      <div class="logo">W</div>
      <div>
        <div class="hdr-title">Werkstatt Pro</div>
        <div class="hdr-sub" id="hdr-sub">Laden…</div>
      </div>
    </div>
    <div class="hdr-r">
      <span id="hdr-user"></span>
      <button class="btn-sm" onclick="doLogout()">Abmelden</button>
    </div>
  </header>

  <main class="content" id="content-wrap">
    <div class="inner" id="content">
      <div class="loading">Laden…</div>
    </div>
  </main>

  <nav class="nav" id="nav"></nav>
  <div class="nav-more-panel" id="more-panel">
    <div class="nav-more-bg" onclick="closeMore()"></div>
    <div class="nav-more-sheet" id="more-sheet"></div>
  </div>
</div>

<div id="modal-root"></div>

<script type="module" src="auth.js"></script>
</body>
</html>

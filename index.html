<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Werkstatt Pro">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="manifest" href="manifest.json">
  <title>Werkstatt Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-logo">W</div>
  <div class="auth-title">Werkstatt Pro</div>
  <div class="auth-sub">Dein Betriebssystem</div>
  <div class="auth-box">
    <div class="auth-tabs">
      <button class="auth-tab on" onclick="authTab('login')">Anmelden</button>
      <button class="auth-tab" onclick="authTab('reg')">Registrieren</button>
    </div>

    <div id="auth-login">
      <div class="field">
        <label>E-Mail</label>
        <input id="a-mail" type="email" autocomplete="email" placeholder="name@beispiel.at"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input id="a-pw" type="password" autocomplete="current-password" placeholder="••••••••"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button id="login-btn" class="btn" style="width:100%;min-height:48px;font-size:.9rem"
              ontouchend="event.preventDefault();doLogin()" onclick="doLogin()">
        Anmelden
      </button>
      <div id="a-err" class="auth-err"></div>
      <div class="auth-divider"></div>
      <button class="btn-secondary" style="width:100%;min-height:44px"
              ontouchend="event.preventDefault();startDemo()" onclick="startDemo()">
        Demo-Modus — ohne Anmeldung
      </button>
    </div>

    <div id="auth-reg" style="display:none">
      <div class="field">
        <label>Name</label>
        <input id="r-name" placeholder="Dein Name" autocomplete="name">
      </div>
      <div class="field">
        <label>E-Mail</label>
        <input id="r-mail" type="email" placeholder="name@beispiel.at" autocomplete="email">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input id="r-pw" type="password" placeholder="Min. 6 Zeichen" autocomplete="new-password">
      </div>
      <button class="btn" style="width:100%;min-height:48px;font-size:.9rem" onclick="doReg()">
        Registrieren
      </button>
      <div id="r-ok" class="auth-ok"></div>
      <div id="r-err" class="auth-err"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header class="hdr">
    <div class="hdr-l">
      <div class="logo">W</div>
      <div>
        <div class="hdr-title">Werkstatt Pro</div>
        <div class="hdr-sub" id="hdr-sub">Laden…</div>
      </div>
    </div>
    <div class="hdr-r">
      <div id="t-pill" class="timer-pill" style="display:none" onclick="goTimer()">
        ▶ <span id="t-val">0:00</span>
      </div>
      <span id="hdr-user"></span>
      <button class="btn-sm" onclick="doLogout()">↩</button>
    </div>
  </header>

  <main class="content" id="content-wrap">
    <div class="inner" id="app-content">
      <div class="loading">Laden…</div>
    </div>
  </main>

  <nav class="nav" id="app-nav"></nav>

  <div id="more-panel" class="more-panel">
    <div class="more-overlay" onclick="closeMore()"></div>
    <div class="more-sheet">
      <button class="more-item" onclick="setTab('inventar')">📦 Inventar</button>
      <button class="more-item" onclick="setTab('stats')">📊 Statistik</button>
      <button class="more-item" onclick="setTab('nutzer')">👥 Nutzer</button>
      <button class="more-item" onclick="setTab('settings')">⚙ Einstellungen</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this)oClose()">
  <div id="modal-box" class="modal-box"></div>
</div>

<script>
// Generate apple-touch-icon PNG via canvas for iOS home screen
(function(){
  try {
    var c=document.createElement('canvas');c.width=c.height=180;
    var x=c.getContext('2d');
    x.fillStyle='#0a0a0c';
    if(x.roundRect){x.beginPath();x.roundRect(0,0,180,180,38);x.fill();}
    else{x.fillRect(0,0,180,180);}
    x.fillStyle='#f59e0b';x.font='bold 118px Georgia,serif';
    x.textAlign='center';x.textBaseline='middle';x.fillText('W',90,94);
    var l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL();
    document.head.appendChild(l);
  } catch(e){}
})();
</script>
<script type="importmap">
{
  "imports": {
    "./auth.js":              "./auth.js?v=9",
    "./db.js":                "./db.js?v=9",
    "./helpers.js":           "./helpers.js?v=9",
    "./pdf.js":               "./pdf.js?v=9",
    "./views/dashboard.js":   "./views/dashboard.js?v=9",
    "./views/auftraege.js":   "./views/auftraege.js?v=9",
    "./views/detail.js":      "./views/detail.js?v=9",
    "./views/dokumente.js":   "./views/dokumente.js?v=9",
    "./views/kunden.js":      "./views/kunden.js?v=9",
    "./views/inventar.js":    "./views/inventar.js?v=9",
    "./views/stats.js":       "./views/stats.js?v=9",
    "./views/nutzer.js":      "./views/nutzer.js?v=9",
    "./views/settings.js":    "./views/settings.js?v=9",
    "./views/modals.js":      "./views/modals.js?v=9",
    "../auth.js":             "./auth.js?v=9",
    "../db.js":               "./db.js?v=9",
    "../helpers.js":          "./helpers.js?v=9",
    "../pdf.js":              "./pdf.js?v=9"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="app.js?v=9"></script>
</body>
</html>
